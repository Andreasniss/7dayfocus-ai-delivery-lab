name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check public repository privacy
        env:
          PRIVACY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRIVACY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/test_privacy.py
          if [ -n "$PRIVACY_BASE" ]; then
            python3 scripts/check_privacy.py --range "$PRIVACY_BASE" "$PRIVACY_HEAD"
          else
            python3 scripts/check_privacy.py --head
          fi
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run verification gate
        run: npm run verify
